name: CI

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway CI database: trust auth, so no password is needed anywhere.
        env:
          POSTGRES_USER: labellens
          POSTGRES_DB: labellens
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labellens" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://labellens@localhost:5432/labellens
      TEST_DATABASE_URL: postgresql+psycopg://labellens@localhost:5432/labellens_test
    steps:
      - uses: actions/checkout@v4
      - name: Generate a throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Migrations apply and match the models
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - name: Create test database
        run: psql -h localhost -U labellens -c 'CREATE DATABASE labellens_test'
      - name: Tests (PostgreSQL)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
